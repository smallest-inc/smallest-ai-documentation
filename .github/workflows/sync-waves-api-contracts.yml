name: Sync Waves API contracts

on:
  repository_dispatch:
    types: [waves_api_contracts_updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and validate generated contracts
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/waves-api-contract"
          jq -r '.client_payload.openapi' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/waves-api-contract/openapi.json"
          jq -r '.client_payload.asyncapi' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/waves-api-contract/asyncapi.json"
          python3 scripts/sync_waves_api_contracts.py --source "${RUNNER_TEMP}/waves-api-contract"
          echo "Synced waves-platform ${SOURCE_SHA}"

      - name: Open or update the documentation sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/waves-api-contracts
          delete-branch: true
          commit-message: "chore(api): sync generated Waves contracts"
          title: "chore(api): sync generated Waves contracts"
          body: |
            Automated contract update from `waves-platform` `${{ github.event.client_payload.source_sha }}`.

            Wire-level schemas are generated by engineering. Documentation descriptions and examples remain in the Fern override files.
          labels: api-contract
