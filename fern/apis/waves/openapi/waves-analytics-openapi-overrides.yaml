# Overrides for waves-analytics-openapi.yaml.
# Tags every operation with the v4docs audience so the products/waves.yml
# layout can resolve them; pins server + section tag for consistency.

paths:
  /waves/v1/analytics/asr/logs:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/asr/history/{request_id}:
    delete:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/asr/usage/timeseries:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/tts/logs:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/tts/usage/timeseries:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/tts/usage/credits/timeseries:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/tts/concurrency/timeseries:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/tts/ws-connections/timeseries:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
  /waves/v1/analytics/webhooks/logs:
    get:
      x-fern-server-name: waves
      x-fern-audiences: [v4docs]
      tags: [Analytics]
