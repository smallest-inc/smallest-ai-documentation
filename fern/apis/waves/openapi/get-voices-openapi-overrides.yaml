# Override for get-voices-openapi.yaml consumed by the unified + waves SDK
# generators. Description and enum are kept in sync with the base spec and
# the waves-v4 docs override so the SDK, docs, and internal-audience surfaces
# all describe the same pool-scoped behavior. Overrides win over base, so any
# base-spec change to description/enum on this endpoint has to be mirrored
# here.

paths:
  /waves/v1/{model}/get_voices:
    get:
      operationId: get_voices
      x-fern-sdk-method-name: get_voices
      x-fern-server-name: waves
      x-fern-audiences:
        - v2
        - v3
        - v4
      description: |
        Return the voice catalog for the chosen Lightning v3.1 pool. Two pools:

        - `lightning-v3.1` — the Standard catalog. Supports voice cloning; 20 language codes.
        - `lightning-v3.1-pro` — the Pro catalog. Curated set across American, British, and Indian accents plus 29 additional languages. Same latency and concurrency as Standard, on dedicated inference.

        The endpoint is pool-scoped: `/waves/v1/lightning-v3.1/get_voices` returns Standard voices only; `/waves/v1/lightning-v3.1-pro/get_voices` returns Pro voices only. Call one or both depending on which pool you plan to use.

        Each voice carries tags (`language`, `accent`, `gender`, `age`, `emotions`, `usecases`). Filter client-side to find the voices that match a target language, accent, or use case. Pass the returned `voiceId` as `voice_id` on the unified [`POST /waves/v1/tts`](/api-reference/models/text-to-speech/synthesize-speech) route, together with `"model": "lightning_v3.1"` (Standard) or `"model": "lightning_v3.1_pro"` (Pro).

        For the canonical per-language voice list (with previews and recommended pairings), see the [Lightning v3.1](/models/model-cards/text-to-speech/lightning-v-3-1) and [Lightning v3.1 Pro](/models/model-cards/text-to-speech/lightning-v-3-1-pro) model cards.
      parameters:
        - in: path
          name: model
          schema:
            enum:
              - lightning-v3.1
              - lightning-v3.1-pro
            default: lightning-v3.1
