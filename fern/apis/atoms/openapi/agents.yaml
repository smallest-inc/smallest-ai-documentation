                      items:
                        type: object
                    edges:
                      type: array
                      items:
                        type: object
                singlePromptConfig:
                  $ref: "./components.yaml#/components/schemas/SinglePromptConfig"
      responses:
        "200":
          description: Workflow updated successfully.
        "400":
          $ref: "./components.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "./components.yaml#/components/responses/UnauthorizedErrorResponse"
        "404":
          description: Workflow not found.
        "500":
          $ref: "./components.yaml#/components/responses/InternalServerErrorResponse"
