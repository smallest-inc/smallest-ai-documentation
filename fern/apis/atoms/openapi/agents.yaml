  /conversation/webcall:
    post:
      tags:
        - Web Call
      summary: Start a web call session
      description: |
        Mints a short-lived LiveKit access token and creates a room the browser client can
        join to have a voice-first call with the agent. Same response shape as `/conversation/chat`;
        the difference is the audio track defaults on the client side. Pair with the
        [Web SDK](/voice-agents/developer-guide/client-libraries) to open the room in-browser.
      operationId: startWebCallConversation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/WebSessionRequest'
            examples:
              default:
                summary: Start a voice call session with an agent
                value:
                  agentId: "6a75935452c6e5eceaa16edf"
      responses:
        '200':
          description: Session minted. Use `token` + `host` on the browser client to join `roomName`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/WebSessionResponse'
              examples:
                success:
                  summary: LiveKit session ready for the browser client
                  value:
                    status: true
                    data:
                      token: "eyJhbGciOiJIUzI1NiJ9.eyJtZXRhZGF0YSI6IntcIm9yZ2FuaXphdGlvbklkXCI6XCI2OTU2MTg5NmEzN2ZkMjE0YjlhOGQzM2NcIn0iLCJ2aWRlbyI6eyJyb29tSm9pbiI6dHJ1ZSwicm9vbSI6IjIwOWNkOGM3LTdmZjQtNGFmYy1iNWQ1LWY3MDQ0OGI1Y2UwNyJ9LCJleHAiOjE3ODYxNTk1ODl9.jf5NM4fH79_d6iBb2xTvX5JIo_PmVpjeXWOugoDLQVc"
                      roomName: "209cd8c7-7ff4-4afc-b5d5-f70448b5ce07"
                      host: "wss://rtc.example-provider.com"
                      conversationId: "w3fmaal3fKnzNQJ_CHfosw"
                      callId: "CALL-1786159527700-838803"
        '400':
          description: Missing or invalid `agentId`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/WebSessionErrorResponse'
              examples:
                missing-agent-id:
                  summary: Missing agentId
                  value:
                    status: false
                    errors: ["agentId: Required"]
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from the console ApiKey collection, sent as Bearer token. Also accepts session cookies for browser-based auth.
tags:
  - name: Agent Templates
    description: Operations related to agent templates
  - name: Agents
    description: Operations related to agents
  # - name: Workflows  # DEPRECATED — workflow agents are being sunset
  - name: Realtime Agent
    description: Start a realtime voice or chat session with an agent over a WebSocket. Use `POST /conversation/register-call` to mint a short-lived access token, then open the Agent WebSocket with it.
  - name: Prompt Scoring
    description: Score and analyse agent prompts across quality dimensions
  - name: Web Call
    description: |
      Mint a short-lived LiveKit access token and pre-provision a room the browser client can
      join to have a chat or a voice call with an agent. Pair with the Web SDK to render the
      session in-browser. `/conversation/chat` and `/conversation/webcall` share the same
      request and response shapes; they differ in the default media track on the client.
