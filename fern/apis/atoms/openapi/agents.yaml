  /agent/{id}/archive:
    delete:
      operationId: deleteAgent
      summary: Archive or unarchive an agent
      x-fern-sdk-group-name: agents
      x-fern-sdk-method-name: archive_agent
      description: |
        Soft-archives the agent — it is excluded from listings and stops accepting calls,
        but all data is preserved and the operation is fully reversible.

        Pass `?on=false` to unarchive (restore) a previously archived agent.

        **409 is returned when:**
        - The agent is already in the requested state (`"Agent is already archived"` / `"Agent is already active"`)
        - The agent is linked to an active campaign (`"Agent is associated with the [status] campaign "[name]". Complete or remove the campaign before archiving."`)
      tags:
        - Agents
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: on
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "true"
          description: |
            `"true"` (default) — archive the agent.
            `"false"` — unarchive (restore) a previously archived agent.
      responses:
        "200":
          description: Agent archived or unarchived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Human-readable outcome message
                        enum:
                          - Agent archived
                          - Agent unarchived
        "400":
          $ref: "./components.yaml#/components/responses/BadRequestError"
        "401":
          $ref: "./components.yaml#/components/responses/UnauthorizedErrorResponse"
        "403":
          $ref: "./components.yaml#/components/responses/ForbiddenError"
        "404":
          description: Agent not found
        "409":
          description: |
            Conflict — agent is already in the requested state, or is linked to an active campaign.
        "500":
          $ref: "./components.yaml#/components/responses/InternalServerErrorResponse"
  /conversation/register-call:
    post:
      summary: Register a realtime agent call
      x-fern-sdk-group-name: realtime
      x-fern-sdk-method-name: register_call
      description: |
        Mint a **short-lived, single-use access token** for opening a realtime
        [Agent WebSocket](/atoms/api-reference/realtime-agent/realtime-agent)
        connection. This is the **recommended** way to start a session from a
        browser or other client-side app: your API key stays server-side, and
        the browser only ever sees the short-lived token. (Server-side or
        trusted clients may instead connect to the WebSocket with a raw API key
        directly.)

        Flow:
        1. Call this endpoint with your API key and the `agent_id` (plus optional
           `mode` and per-call `variables`). All session configuration is fixed
           here — it is baked into the returned token.
        2. Open a WebSocket to `wss://api.smallest.ai/atoms/v1/agent/connect?token=<access_token>`.
           No `agent_id`, `mode`, or `variables` query params are needed on the
           WebSocket — they come from the token.

        The token is valid for `expires_in` seconds (30) and can be used for a
        single connection. Request a fresh token for each connection.
      tags:
        - Realtime Agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  description: The Atoms agent to connect to.
                  example: "69da0b4c20c0e03cfa4ee258"
                mode:
                  type: string
                  enum: [webcall, chat]
                  default: webcall
                  description: |
                    Session mode. `webcall` = full voice pipeline (audio in +
                    audio out). `chat` = text-only pipeline. Defaults to `webcall`.
                sample_rate:
                  type: integer
                  enum: [8000, 16000, 24000, 44100]
                  default: 24000
                  deprecated: true
                  description: |
                    **Deprecated. Use `output_audio_format` instead.** Still
                    accepted, and will keep being accepted - existing
                    integrations do not need to change.

                    A bare rate meaning PCM at that rate, so `sample_rate: 24000`
                    and `output_audio_format: "pcm_24000"` are the same request.
                    It predates the one-token-per-direction contract and is the
                    reason two fields exist for one thing. `44100` is only rendered by the
                    `lightning-v3.1` and `lightning-v3.1-pro` voices; asking for a
                    rate the agent's voice cannot render is refused here rather
                    than failing mid-call. This does **not** set the rate of the
                    audio you send - use `input_audio_format`.
                  example: 24000
                input_audio_format:
                  type: string
                  enum:
                    - pcm_8000
                    - pcm_16000
                    - pcm_22050
                    - pcm_24000
                    - pcm_44100
                    - pcm_48000
                    - mulaw_8000
                    - alaw_8000
                    - opus_8000
                    - opus_16000
                    - opus_24000
                    - opus_48000
                  description: |
                    The format you will **send**, as one `<encoding>_<rate>` token
                    naming both the encoding and the rate. Defaults to PCM at the
                    output rate, so a client sending only `sample_rate` needs
                    nothing else.

                    The recogniser is configured at this rate and your audio is
                    not resampled, so the token must match the bytes you send: a
                    mismatch produces wrong transcripts and no error. G.711 exists
                    only at 8000. Opus is raw packets, one per WebSocket message;
                    Ogg-framed Opus is a different format and is refused.

                    A browser client can also declare this later, on the connect
                    URL, once its `AudioContext` reports the rate it actually got.
                  example: pcm_24000
                output_audio_format:
                  type: string
                  enum: [pcm_8000, pcm_16000, pcm_24000, pcm_44100]
                  default: pcm_24000
                  description: |
                    The format the agent sends back. Same token shape as
                    `input_audio_format`. Sending this together with `sample_rate`
                    is allowed only if they agree; disagreeing values are refused
                    rather than resolved by a precedence rule.
                  example: pcm_24000
                variables:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                  description: |
                    Per-call prompt variables that override the agent's
                    `defaultVariables` for this session only. Values must be
                    `string`, `number`, or `boolean`. Reserved system-variable
                    keys (`call_id`, `conversation_type`, `agent_number`,
                    `user_number`, `current_date`, `current_time`, `current_day`,
                    `agent_gender`, `default_language`, `supported_languages`,
                    `timezone`) are populated by the server and stripped if
                    supplied.
                  example:
                    customer_name: "Tanay"
                    account_tier: "gold"
      responses:
        "201":
          description: Access token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: |
                          Short-lived, single-use token (prefixed `wct_`). Pass it
                          as the `token` query param when opening the Agent
                          WebSocket.
                        example: "wct_9f8c2b1e-4d5a-4e6f-a7b8-c9d0e1f2a3b4"
                      expires_in:
                        type: integer
                        description: Token lifetime in seconds.
                        example: 30
                      sample_rate:
                        type: integer
                        description: |
                          Negotiated audio sample rate (Hz) for the session. Echoed
                          back in the WebSocket `session.created` event.
                        example: 24000
                      input_audio_format:
                        type: string
                        description: |
                          The input format resolved for this session. Read it back
                          to confirm the server understood what you meant before
                          you send any audio.
                        example: pcm_24000
                      output_audio_format:
                        type: string
                        description: The output format resolved for this session.
                        example: pcm_24000
        "400":
          description: |
            Validation failed (e.g. missing `agent_id`), or the organization has
            no remaining credits.
          content:
            application/json:
              schema:
                $ref: "./components.yaml#/components/schemas/BadRequestErrorResponse"
        "401":
          $ref: "./components.yaml#/components/responses/UnauthorizedErrorResponse"
        "404":
          $ref: "./components.yaml#/components/responses/NotFoundErrorResponse"
        "500":
          $ref: "./components.yaml#/components/responses/InternalServerErrorResponse"
  /prompt-scoring/score:
    post:
      summary: Score a prompt
      description: |
        Scores an agent's prompt across 11 quality dimensions using Gemini-based analysis. Requires the prompt to have changed since the last scoring.

        **Input:** Provide exactly one of `versionId` (published agent version) or `draftId` (agent draft). Providing both or neither returns a 400.

        **Credit usage:** 1 credit is deducted per successful call.

        **Idempotency:** Re-submitting the same prompt without changes returns a 400 — retrieve the cached score via the GET agent endpoint instead.

        **Supported agent types:** Only `single_prompt` agents are supported. Workflow-graph agents return a 400.

        **Scoring model:** Two sequential Gemini calls — a Platform Analyst pass followed by a Rubric Judge pass.

        ### Scored Dimensions

        | Tier | Dimension | Notes |
        |------|-----------|-------|
        | 1 | Role & Objective | |
        | 1 | Personality & Voice | |
        | 1 | Conversation Structure | |
        | 1 | Tool Integration | |
        | 1 | Constraints & Safety | |
        | 2 | Conversational Naturalness | |
        | 2 | Failure-Mode Coverage | |
        | 3 | Information Integrity | Gating — if Weak/Missing, score capped at 70 |
        | 3 | Variable & Tool Hygiene | Gating — if Weak/Missing, score capped at 50 |
        | 3 | Internal Consistency | |
        | 3 | Density | Computed from token analysis |
      tags:
        - Prompt Scoring
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `versionId` or `draftId` must be provided.
              oneOf:
                - required: [versionId]
                  properties:
                    versionId:
                      type: string
                      description: Published agent version ID (MongoDB ObjectId).
                      example: "6a1589b75e048394eb37bc47"
                - required: [draftId]
                  properties:
                    draftId:
                      type: string
                      description: Agent draft ID (MongoDB ObjectId).
                      example: "6a1589b75e048394eb37bc48"
      responses:
        "200":
          description: Prompt scored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      overall_score:
                        type: integer
                        description: 0–100 quality score.
                        example: 82
                      overall_grade:
                        type: string
                        description: Human-readable grade.
                        enum: ["Excellent", "Good", "Needs Work", "Poor"]
                        example: "Good"
                      band:
                        type: string
                        description: |
                          Token density band based on prompt length:
                          - `lean` — fewer than 4K tokens
                          - `normal` — 4K–9.9K tokens
                          - `heavy` — 10K–14.9K tokens
                          - `overweight` — 15K or more tokens
                        enum: ["lean", "normal", "heavy", "overweight"]
                        example: "normal"
                      estimated_ttft_overhead_ms:
                        type: number
                        description: Estimated first-token latency overhead in milliseconds introduced by the prompt length.
                        example: 420
                      dimensions:
                        type: array
                        description: Per-dimension scoring results across 11 quality dimensions.
                        items:
                          type: object
                          properties:
                            tier:
                              type: integer
                              description: "Priority tier: 1 (highest), 2, or 3."
                              enum: [1, 2, 3]
                              example: 1
                            level:
                              type: string
                              description: Quality level for this dimension.
                              enum: ["Strong", "Adequate", "Weak", "Missing", "Not Applicable"]
                              example: "Strong"
                            evidence_span:
                              type: string
                              description: Quote from the prompt supporting the assessment. Empty string if no relevant content was found.
                              example: "You are a helpful support agent..."
                            title:
                              type: string
                              description: Short dimension name.
                              example: "Role & Objective"
                            description:
                              type: string
                              description: Explanation of the score for this dimension.
                              example: "Prompt clearly defines the agent's role and primary objective."
              example:
                status: true
                data:
                  overall_score: 56
                  overall_grade: "Needs Work"
                  band: "lean"
                  estimated_ttft_overhead_ms: 12.9
                  dimensions:
                    - tier: 1
                      level: "Adequate"
                      evidence_span: "You are a friendly and helpful weather assistant. Your role is to provide accurate, real-time weather information to users."
                      title: "Clear but basic role definition"
                      description: "The role is clearly defined but lacks specific success criteria or scope boundaries."
                    - tier: 1
                      level: "Weak"
                      evidence_span: "Use the get_weather function to fetch real-time data"
                      title: "Undeclared tool reference"
                      description: "The 'get_weather' tool is referenced but not defined, and failure paths are missing."
                    - tier: 2
                      level: "Missing"
                      evidence_span: "no relevant content found"
                      title: "No failure mode coverage"
                      description: "The prompt contains no instructions for handling errors, tool failures, or unclear user input."
        "400":
          description: |
            Bad request. Possible reasons:
            - Neither or both of `versionId`/`draftId` provided
            - Organization has no credits available
            - Agent is a conversational/workflow-graph type (not supported)
            - Prompt unchanged since last scoring — retrieve the existing score via GET agent
            - No prompt found on the version or draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["Prompt has not changed since last scoring — retrieve the existing score via GET agent"]
        "401":
          $ref: "./components.yaml#/components/responses/UnauthorizedErrorResponse"
        "403":
          description: Not a member of the organization or insufficient role (minimum Member required).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["You are not a member of this organization"]
        "404":
          description: Version or draft not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["Version not found"]
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Rate limit exceeded"
                  rateLimit:
                    type: object
                    properties:
                      routeClass:
                        type: string
                        example: "prompt-scoring"
                      limit:
                        type: integer
                        example: 10
                      retryAfterSec:
                        type: integer
                        description: Seconds to wait before retrying.
                        example: 60
        "500":
          description: Gemini scoring failed after retries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    type: array
                    items:
                      type: string
                    example: ["Prompt scoring failed"]
  /conversation/chat:
    post:
      tags:
        - Web Call
      summary: Start a web chat session
      description: |
        Mints a short-lived LiveKit access token and creates a room the browser client can
        join to have a text-first chat with the agent. The response includes the room name,
        the LiveKit host to connect to, a `conversationId` for correlation, and a `callId`
        that shows up in call logs. Pair with the [Web SDK](/voice-agents/developer-guide/client-libraries)
        to render the session in-browser.
      operationId: startWebChatConversation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/WebSessionRequest'
            examples:
              default:
                summary: Start a chat session with an agent
                value:
                  agentId: "6a75935452c6e5eceaa16edf"
      responses:
        '200':
          description: Session minted. Use `token` + `host` on the browser client to join `roomName`.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/WebSessionResponse'
              examples:
                success:
                  summary: LiveKit session ready for the browser client
                  value:
                    status: true
                    data:
