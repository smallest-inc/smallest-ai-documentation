        - name: campaignId
          in: query
          schema:
            type: string
          description: Campaign ID to filter results
        - name: callType
          in: query
          schema:
            type: string
          description: "Type of call to filter (e.g. `inbound`, `outbound`)"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Start of date range (ISO 8601)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
          description: End of date range (ISO 8601)
        - name: sortBy
          in: query
          schema:
            type: string
          description: "Field to sort by (e.g. `totalCalls`, `pickupRate`, `avgDuration`)"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
        - name: limit
          in: query
          schema:
            type: integer
