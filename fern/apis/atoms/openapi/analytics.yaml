  /analytics/concurrency:
    get:
      operationId: getAnalyticsConcurrency
      summary: Concurrent call counts
      description: Returns minute-by-minute concurrent call counts for a specific day. Optionally broken down per agent.
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: "Date to query (YYYY-MM-DD)"
        - name: agentId
          in: query
          schema:
            type: string
          description: Filter to a specific agent
        - name: includeAgents
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Pass `true` to include a per-agent breakdown in the response
      responses:
        "200":
          description: Minute-level concurrency data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      dataPoints:
                        type: array
                        items:
                          type: object
                          properties:
                            minute:
                              type: string
                              description: "Time in HH:MM format"
                            concurrentCalls:
                              type: number
                      peakConcurrent:
                        type: number
                      avgConcurrent:
                        type: number
                      totalMinutes:
                        type: number
                      byAgent:
                        type: array
                        description: Only present when `includeAgents=true`
                        items:
                          type: object
                          properties:
                            agentId:
                              type: string
                            peakConcurrent:
                              type: number
                            avgConcurrent:
                              type: number
                            totalCalls:
                              type: number
